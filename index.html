<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rock Paper Scissors</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <div
        class="card shadow-sm border-0 rounded-3 p-4 mx-auto text-center"
        style="max-width: 450px"
      >
        <h2 class="text-primary mb-2">Rock Paper Scissors</h2>

        <p class="text-muted mb-4">Choose your move!</p>

        <div class="row g-2 mb-4">
          <div class="col-4">
            <button
              class="btn btn-outline-primary w-100 p-2"
              onclick="playGame('rock')"
            >
              <img
                src="https://st.depositphotos.com/1999963/2988/i/950/depositphotos_29886401-stock-photo-rock-paper-scissors-rock-hand.jpg"
                alt="Rock"
                class="img-fluid mb-2"
                style="height: 65px"
              />
              <div>Rock</div>
            </button>
          </div>

          <div class="col-4">
            <button
              class="btn btn-outline-success w-100 p-2"
              onclick="playGame('paper')"
            >
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScYeJlLi9qO5UbgWbRLBcCTr9cSIZhWDjfEXZ3gl-32W0L7LjedmZjSkY&s=10"
                alt="Paper"
                class="img-fluid mb-2"
                style="height: 65px"
              />
              <div>Paper</div>
            </button>
          </div>

          <div class="col-4">
            <button
              class="btn btn-outline-danger w-100 p-2"
              onclick="playGame('scissors')"
            >
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR72gm3MiOm-kZEyZRm1AMqb5gnH48ZR4CzRGqdhPz8DJPwLgrT0CubkOw&s=10"
                alt="Scissors"
                class="img-fluid mb-2"
                style="height: 65px"
              />
              <div>Scissors</div>
            </button>
          </div>
        </div>

        <div class="bg-light rounded p-3 mb-3">
          <p id="playerChoice" class="mb-2">Your choice: -</p>

          <p id="computerChoice" class="mb-2">Computer choice: -</p>

          <h5 id="result" class="text-primary mb-0">Let's Play!</h5>
        </div>

       
        <div class="row g-2 mb-3">
          <div class="col-6">
            <div class="border rounded p-3">
              <p class="text-muted mb-1">You</p>
              <h3 id="playerScore" class="text-primary mb-0">0</h3>
            </div>
          </div>

          <div class="col-6">
            <div class="border rounded p-3">
              <p class="text-muted mb-1">Computer</p>
              <h3 id="computerScore" class="text-danger mb-0">0</h3>
            </div>
          </div>
        </div>

        <button class="btn btn-dark w-100" onclick="restartGame()">
          Restart Game
        </button>
      </div>
    </div>

    <script>
      let playerScore = 0;
      let computerScore = 0;

      function playGame(playerChoice) {
        let choices = ["rock", "paper", "scissors"];

        let computerChoice = choices[Math.floor(Math.random() * 3)];

        document.getElementById("playerChoice").innerText =
          "Your choice: " + playerChoice;

        document.getElementById("computerChoice").innerText =
          "Computer choice: " + computerChoice;

        let result = "";

        if (playerChoice === computerChoice) {
          result = "It's a Draw!";
        } else if (
          (playerChoice === "rock" && computerChoice === "scissors") ||
          (playerChoice === "paper" && computerChoice === "rock") ||
          (playerChoice === "scissors" && computerChoice === "paper")
        ) {
          result = "You Win! ";
          playerScore++;
        } else {
          result = "Computer Wins!";
          computerScore++;
        }

        document.getElementById("result").innerText = result;
        document.getElementById("playerScore").innerText = playerScore;
        document.getElementById("computerScore").innerText = computerScore;
      }

      function restartGame() {
        playerScore = 0;
        computerScore = 0;

        document.getElementById("playerChoice").innerText = "Your choice: -";

        document.getElementById("computerChoice").innerText =
          "Computer choice: -";

        document.getElementById("result").innerText = "Let's Play!";

        document.getElementById("playerScore").innerText = 0;
        document.getElementById("computerScore").innerText = 0;
      }
    </script>
  </body>
</html>
